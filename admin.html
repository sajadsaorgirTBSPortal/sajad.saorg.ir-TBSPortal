<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت - سامانه تأیید تحصیلی</title>

<style>
:root {
  --primary: #0d3b66;
  --primary-light: #1a6b8a;
  --gold: #f0c27a;
  --bg: #f4f7fa;
  --card: #ffffff;
  --danger: #b91c1c;
  --success: #166534;
  --radius: 10px;
  --shadow: 0 8px 30px rgba(13, 59, 102, 0.08);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Tahoma', 'IranSans', sans-serif;
  background: var(--bg);
  color: #1a1a2e;
  padding: 20px;
  min-height: 100vh;
}

/* ===== لاگین ===== */
.login-container {
  max-width: 400px;
  margin: 80px auto;
  background: var(--card);
  padding: 32px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid #e5e9f0;
}

.login-container h2 {
  text-align: center;
  color: var(--primary);
  margin-bottom: 24px;
  font-size: 20px;
  border-bottom: 3px solid var(--gold);
  padding-bottom: 12px;
}

.login-container label {
  display: block;
  font-weight: 700;
  margin: 12px 0 6px;
  font-size: 14px;
  color: var(--primary);
}

.login-container input {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid #d1d5db;
  border-radius: var(--radius);
  font-size: 15px;
  outline: none;
  transition: 0.2s;
}

.login-container input:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(26, 107, 138, 0.10);
}

.login-container .btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  margin-top: 18px;
  transition: 0.2s;
}

.login-container .btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(13, 59, 102, 0.25);
}

.login-error {
  color: var(--danger);
  text-align: center;
  margin-top: 12px;
  font-weight: 600;
  display: none;
}

/* ===== پنل مدیریت ===== */
.admin-panel {
  display: none;
  max-width: 1100px;
  margin: 0 auto;
}

.admin-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  padding: 16px 24px;
  border-radius: var(--radius);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 24px;
  border-bottom: 3px solid var(--gold);
}

.admin-header h1 {
  font-size: 20px;
  font-weight: 700;
}

.admin-header .logout-btn {
  background: transparent;
  border: 2px solid #fff;
  color: #fff;
  padding: 8px 20px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  transition: 0.2s;
}

.admin-header .logout-btn:hover {
  background: #fff;
  color: var(--primary);
}

.admin-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-box {
  background: var(--card);
  padding: 18px;
  border-radius: var(--radius);
  border: 1px solid #e5e9f0;
  text-align: center;
  box-shadow: var(--shadow);
}

.stat-box .number {
  font-size: 28px;
  font-weight: 900;
  color: var(--primary);
}

.stat-box .label {
  font-size: 13px;
  color: #6b7280;
  margin-top: 4px;
}

.admin-card {
  background: var(--card);
  padding: 24px;
  border-radius: var(--radius);
  border: 1px solid #e5e9f0;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}

.admin-card h3 {
  color: var(--primary);
  margin-bottom: 16px;
  font-size: 17px;
  border-bottom: 3px solid var(--gold);
  padding-bottom: 8px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.form-grid .full-width {
  grid-column: 1 / -1;
}

.form-grid label {
  font-weight: 600;
  font-size: 13px;
  display: block;
  margin-bottom: 4px;
  color: var(--primary);
}

.form-grid input,
.form-grid select,
.form-grid textarea {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #d1d5db;
  border-radius: var(--radius);
  font-size: 14px;
  outline: none;
  transition: 0.2s;
  font-family: inherit;
}

.form-grid input:focus,
.form-grid select:focus,
.form-grid textarea:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(26, 107, 138, 0.10);
}

.form-grid textarea {
  resize: vertical;
  min-height: 60px;
}

/* ===== بخش لینک عکس ===== */
.photo-link-section {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px 0;
  background: #f8f9fc;
  border-radius: 8px;
  padding: 16px;
  border: 1px solid #e5e9f0;
}

.photo-link-section .preview {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  object-fit: cover;
  background: #f0f2f5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  color: #9ca3af;
  flex-shrink: 0;
}

.photo-link-section .link-input {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 200px;
}

.photo-link-section .link-input input {
  padding: 10px 14px;
  border: 2px solid #d1d5db;
  border-radius: 6px;
  font-size: 14px;
  outline: none;
  transition: 0.2s;
  direction: ltr;
}

.photo-link-section .link-input input:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(26, 107, 138, 0.10);
}

.photo-link-section .link-input small {
  color: #6b7280;
  font-size: 12px;
}

.photo-link-section .btn-preview {
  padding: 8px 20px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: 0.2s;
}

.photo-link-section .btn-preview:hover {
  background: var(--primary-light);
}

.photo-link-section .btn-remove {
  padding: 8px 16px;
  background: var(--danger);
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
}

.photo-link-section .btn-remove:hover {
  background: #7a1515;
}

.btn-submit {
  padding: 12px 28px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: 0.2s;
  margin-top: 10px;
}

.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(13, 59, 102, 0.25);
}

.btn-danger {
  background: var(--danger);
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: 0.2s;
}

.btn-danger:hover {
  background: #7a1515;
}

.btn-success {
  background: var(--success);
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: 0.2s;
}

.btn-success:hover {
  background: #0f4a2a;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  padding: 10px 12px;
  text-align: center;
  border: 1px solid #e5e9f0;
}

th {
  background: var(--primary);
  color: #fff;
  font-weight: 700;
}

tr:nth-child(even) {
  background: #f8f9fc;
}

.record-photo {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--gold);
  background: #f0f2f5;
}

.record-photo-placeholder {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid #d1d5db;
  background: #f0f2f5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #9ca3af;
}

.action-btn {
  padding: 4px 12px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  transition: 0.2s;
  margin: 2px;
}

.action-btn.edit {
  background: var(--gold);
  color: var(--primary);
}

.action-btn.edit:hover {
  background: #e0b05a;
}

.action-btn.delete {
  background: var(--danger);
  color: #fff;
}

.action-btn.delete:hover {
  background: #7a1515;
}

.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 28px;
  border-radius: var(--radius);
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  z-index: 999;
  display: none;
  animation: slideDown 0.4s ease;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}

.toast.success {
  background: var(--success);
}

.toast.error {
  background: var(--danger);
}

@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.generated-code {
  background: #f0f7f0;
  border: 2px solid var(--success);
  padding: 12px;
  border-radius: var(--radius);
  text-align: center;
  margin-top: 12px;
  font-size: 18px;
  font-weight: 900;
  color: var(--primary);
  letter-spacing: 2px;
  display: none;
}

/* ===== مودال ویرایش ===== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.modal-box {
  background: #fff;
  max-width: 700px;
  width: 95%;
  padding: 28px 30px;
  border-radius: var(--radius);
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  animation: modalIn 0.3s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-box h2 {
  color: var(--primary);
  border-bottom: 3px solid var(--gold);
  padding-bottom: 12px;
  margin-bottom: 20px;
  text-align: center;
}

.modal-box .form-grid {
  max-height: 70vh;
  overflow-y: auto;
  padding-right: 4px;
}

.modal-box .form-grid::-webkit-scrollbar {
  width: 4px;
}

.modal-box .form-grid::-webkit-scrollbar-thumb {
  background: var(--gold);
  border-radius: 4px;
}

.modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  justify-content: flex-end;
  flex-wrap: wrap;
}

.modal-actions button {
  padding: 10px 28px;
  border: none;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s;
}

.modal-actions .btn-save {
  background: var(--success);
  color: #fff;
}

.modal-actions .btn-save:hover {
  background: #0f4a2a;
}

.modal-actions .btn-cancel {
  background: #d1d5db;
  color: #1a1a2e;
}

.modal-actions .btn-cancel:hover {
  background: #b0b5bb;
}

@media (max-width: 640px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
  .admin-header {
    flex-direction: column;
    text-align: center;
  }
  .admin-stats {
    grid-template-columns: 1fr 1fr;
  }
  .login-container {
    margin: 40px 12px;
    padding: 24px;
  }
  .photo-link-section {
    flex-direction: column;
    align-items: center;
  }
  .photo-link-section .link-input {
    width: 100%;
  }
  .modal-box {
    padding: 20px;
    max-height: 95vh;
    overflow-y: auto;
  }
}
</style>
</head>
<body>

<!-- ===== توست ===== -->
<div id="toast" class="toast"></div>

<!-- ===== مودال ویرایش ===== -->
<div id="editModal" class="modal-overlay">
  <div class="modal-box">
    <h2>✏️ ویرایش اطلاعات</h2>
    <div class="form-grid" id="editForm">
      <!-- فیلدها توسط JS پر میشه -->
    </div>
    <div class="modal-actions">
      <button class="btn-save" onclick="saveEdit()">💾 ذخیره تغییرات</button>
      <button class="btn-cancel" onclick="closeEditModal()">❌ انصراف</button>
    </div>
  </div>
</div>

<!-- ===== لاگین ===== -->
<div id="loginContainer" class="login-container">
  <h2>پنل مدیریت</h2>
  <label>نام کاربری</label>
  <input id="loginUser" type="text" placeholder="نام کاربری" />
  <label>رمز عبور</label>
  <input id="loginPass" type="password" placeholder="رمز عبور" />
  <button class="btn" id="loginBtn">ورود</button>
  <div id="loginError" class="login-error">❌ نام کاربری یا رمز عبور اشتباه است</div>
</div>

<!-- ===== پنل مدیریت ===== -->
<div id="adminPanel" class="admin-panel">

  <div class="admin-header">
    <h1>📋 پنل مدیریت - سامانه تأیید تحصیلی</h1>
    <div>
      <span id="adminUser" style="margin-left:16px;font-weight:400;opacity:0.8;">admin</span>
      <button class="logout-btn" id="logoutBtn">خروج</button>
    </div>
  </div>

  <!-- آمار -->
  <div class="admin-stats">
    <div class="stat-box">
      <div class="number" id="totalCount">0</div>
      <div class="label">تعداد کل</div>
    </div>
    <div class="stat-box">
      <div class="number" id="doneCount">0</div>
      <div class="label">فارغ‌التحصیلان</div>
    </div>
  </div>

  <!-- ===== فرم اضافه کردن ===== -->
  <div class="admin-card">
    <h3>➕ افزودن دانشجو / فارغ‌التحصیل جدید</h3>
    <div class="form-grid">
      <div>
        <label>نام و نام خانوادگی *</label>
        <input id="fName" placeholder="مثال: علی‌اسکندری" />
      </div>
      <div>
        <label>کد ملی *</label>
        <input id="fNationalId" placeholder="مثال: ۰۰۷۸۲۲۹۵۰۲" />
      </div>
      <div>
        <label>مقطع تحصیلی *</label>
        <input id="fDegree" placeholder="مثال: دکتری" />
      </div>
      <div>
        <label>رشته تحصیلی *</label>
        <input id="fMajor" placeholder="مثال: زیست‌شناسی ژنتیک" />
      </div>
      <div>
        <label>تعداد واحدها</label>
        <input id="fUnits" placeholder="مثال: ۳۲ واحد" />
      </div>
      <div>
        <label>تاریخ فارغ‌التحصیلی *</label>
        <input id="fGradDate" placeholder="مثال: ۱۴۰۴/۰۶/۳۰" />
      </div>
      <div class="full-width">
        <label>دانشگاه *</label>
        <input id="fUniversity" placeholder="مثال: دانشگاه آزاد اسلامی واحد تهران شمال" />
      </div>

      <!-- ===== لینک عکس ===== -->
      <div class="full-width">
        <label>📸 لینک عکس</label>
        <div class="photo-link-section">
          <img id="fPhotoPreview" class="preview" src="" alt="پیش‌نمایش" style="display:none;" />
          <div id="fNoPhotoPreview" class="preview" style="display:flex;">👤</div>
          <div class="link-input">
            <input id="fPhotoLink" placeholder="https://github.com/.../photo.jpg" dir="ltr" />
            <small>لینک عکس آپلود شده در گیت‌هاب یا سرویس ابری</small>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button type="button" class="btn-preview" onclick="previewPhoto()">👁️ پیش‌نمایش</button>
              <button type="button" class="btn-remove" onclick="removePhotoLink()">🗑️ حذف</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button class="btn-submit" id="addBtn">➕ افزودن</button>
    <div id="generatedCode" class="generated-code"></div>
  </div>

  <!-- ===== لیست ===== -->
  <div class="admin-card">
    <h3>📋 لیست دانشجویان / فارغ‌التحصیلان</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>عکس</th>
            <th>کد</th>
            <th>نام</th>
            <th>کد ملی</th>
            <th>مقطع</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody id="recordsTable">
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function() {

  // ============================================================
  //  📚 دیتابیس
  // ============================================================
  let records = {
    "89341562": {
      name: "علی‌اسکندری",
      nationalId: "۰۰۷۸۲۲۹۵۰۲",
      degree: "دکتری",
      major: "زیست‌شناسی ژنتیک‌مولکولی",
      units: "۳۲ واحد درسی تخصصی و عمومی",
      gradDate: "۱۴۰۴/۰۶/۳۰",
      university: "دانشگاه آزاد اسلامی واحد تهران شمال",
      photo: ""
    },
    "98101364": {
      name: "حسین سعیدیان",
      nationalId: "۰۵۷۹۷۲۵۰۰۶",
      degree: "دکتری",
      major: "فیزیولوژی ورزشی",
      units: "۳۲ واحد درسی عمومی و تخصصی",
      gradDate: "۱۴۰۳/۰۷/۰۵",
      university: "دانشگاه آزاد اسلامی واحد مرکزی",
      photo: "https://github.com/sajadsaorgirTBSPortal/sajad.saorg.ir-TBSPortal/raw/refs/heads/main/Screenshot_20251030_205008_Chrome(1).jpg"
    }
  };

  // ============================================================
  //  متغیرها
  // ============================================================
  let currentPhotoLink = "";
  let editingCode = null;

  // ============================================================
  //  توابع
  // ============================================================
  function generateCode() {
    let code;
    let attempts = 0;
    do {
      code = String(Math.floor(10000000 + Math.random() * 90000000));
      attempts++;
    } while (records[code] && attempts < 100);
    return code;
  }

  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + type;
    toast.style.display = 'block';
    setTimeout(() => {
      toast.style.display = 'none';
    }, 3000);
  }

  function updateStats() {
    const total = Object.keys(records).length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('doneCount').textContent = total;
  }

  function renderTable() {
    const tbody = document.getElementById('recordsTable');
    const keys = Object.keys(records);
    if (keys.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="padding:20px;color:#6b7280;">هیچ رکوردی ثبت نشده است</td></tr>';
      return;
    }
    let html = '';
    keys.forEach(code => {
      const r = records[code];
      const photoHtml = r.photo && r.photo.trim() !== '' ?
        `<img src="${r.photo}" class="record-photo" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\\'font-size:18px;\\'>👤</span>';" />` :
        `<span style="font-size:18px;">👤</span>`;
      html += `
        <tr>
          <td>${photoHtml}</td>
          <td><strong>${code}</strong></td>
          <td>${r.name}</td>
          <td>${r.nationalId}</td>
          <td>${r.degree}</td>
          <td>
            <button class="action-btn edit" onclick="openEditModal('${code}')">✏️ ویرایش</button>
            <button class="action-btn delete" onclick="deleteRecord('${code}')">🗑️ حذف</button>
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
    updateStats();
  }

  // ============================================================
  //  توابع گلوبال
  // ============================================================
  window.deleteRecord = function(code) {
    if (!confirm(`آیا از حذف رکورد با کد ${code} مطمئن هستید؟`)) return;
    delete records[code];
    renderTable();
    saveToStorage();
    showToast('رکورد با موفقیت حذف شد', 'success');
  };

  // ============================================================
  //  عکس
  // ============================================================
  function previewPhoto() {
    const link = document.getElementById('fPhotoLink').value.trim();
    if (!link) {
      showToast('لطفاً لینک عکس را وارد کنید', 'error');
      return;
    }
    if (!link.startsWith('http://') && !link.startsWith('https://')) {
      showToast('لینک باید با http:// یا https:// شروع شود', 'error');
      return;
    }
    currentPhotoLink = link;
    document.getElementById('fPhotoPreview').src = link;
    document.getElementById('fPhotoPreview').style.display = 'block';
    document.getElementById('fNoPhotoPreview').style.display = 'none';
    showToast('✅ پیش‌نمایش بارگذاری شد', 'success');
  }

  function removePhotoLink() {
    currentPhotoLink = "";
    document.getElementById('fPhotoLink').value = '';
    document.getElementById('fPhotoPreview').src = '';
    document.getElementById('fPhotoPreview').style.display = 'none';
    document.getElementById('fNoPhotoPreview').style.display = 'flex';
  }

  // ============================================================
  //  مودال ویرایش
  // ============================================================
  window.openEditModal = function(code) {
    editingCode = code;
    const data = records[code];
    if (!data) return;

    const form = document.getElementById('editForm');
    form.innerHTML = `
      <div>
        <label>نام و نام خانوادگی *</label>
        <input id="eName" value="${data.name || ''}" />
      </div>
      <div>
        <label>کد ملی *</label>
        <input id="eNationalId" value="${data.nationalId || ''}" />
      </div>
      <div>
        <label>مقطع تحصیلی *</label>
        <input id="eDegree" value="${data.degree || ''}" />
      </div>
      <div>
        <label>رشته تحصیلی *</label>
        <input id="eMajor" value="${data.major || ''}" />
      </div>
      <div>
        <label>تعداد واحدها</label>
        <input id="eUnits" value="${data.units || ''}" />
      </div>
      <div>
        <label>تاریخ فارغ‌التحصیلی *</label>
        <input id="eGradDate" value="${data.gradDate || ''}" />
      </div>
      <div class="full-width">
        <label>دانشگاه *</label>
        <input id="eUniversity" value="${data.university || ''}" />
      </div>
      <div class="full-width">
        <label>📸 لینک عکس</label>
        <input id="ePhotoLink" value="${data.photo || ''}" placeholder="https://..." dir="ltr" style="width:100%;padding:10px 12px;border:2px solid #d1d5db;border-radius:6px;font-size:14px;" />
        <small style="color:#6b7280;font-size:12px;">لینک عکس آپلود شده در گیت‌هاب یا سرویس ابری</small>
      </div>
    `;

    document.getElementById('editModal').style.display = 'flex';
  };

  window.closeEditModal = function() {
    document.getElementById('editModal').style.display = 'none';
    editingCode = null;
  };

  window.saveEdit = function() {
    if (!editingCode) return;

    const name = document.getElementById('eName').value.trim();
    const nationalId = document.getElementById('eNationalId').value.trim();
    const degree = document.getElementById('eDegree').value.trim();
    const major = document.getElementById('eMajor').value.trim();
    const units = document.getElementById('eUnits').value.trim();
    const gradDate = document.getElementById('eGradDate').value.trim();
    const university = document.getElementById('eUniversity').value.trim();
    const photo = document.getElementById('ePhotoLink').value.trim();

    if (!name || !nationalId || !degree || !major || !gradDate || !university) {
      showToast('لطفاً تمام فیلدهای الزامی (*) را پر کنید', 'error');
      return;
    }

    records[editingCode] = {
      name,
      nationalId,
      degree,
      major,
      units: units || '—',
      gradDate,
      university,
      photo: photo || ''
    };

    saveToStorage();
    renderTable();
    closeEditModal();
    showToast('✅ اطلاعات با موفقیت ویرایش شد', 'success');
  };

  // کلیک خارج از مودال برای بستن
  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
  });

  // ============================================================
  //  ذخیره و بازیابی
  // ============================================================
  function saveToStorage() {
    try {
      localStorage.setItem('educationRecords', JSON.stringify(records));
    } catch(e) {}
  }

  function loadFromStorage() {
    try {
      const data = localStorage.getItem('educationRecords');
      if (data) {
        const parsed = JSON.parse(data);
        if (Object.keys(parsed).length > 0) {
          records = parsed;
        }
      }
    } catch(e) {}
  }

  // ============================================================
  //  لاگین
  // ============================================================
  const loginContainer = document.getElementById('loginContainer');
  const adminPanel = document.getElementById('adminPanel');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');

  function doLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    if (user === 'admin' && pass === 'admin90') {
      loginContainer.style.display = 'none';
      adminPanel.style.display = 'block';
      loginError.style.display = 'none';
      loadFromStorage();
      renderTable();
      showToast('به پنل مدیریت خوش آمدید', 'success');
    } else {
      loginError.style.display = 'block';
    }
  }

  loginBtn.addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('loginUser').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  logoutBtn.addEventListener('click', function() {
    if (confirm('آیا از خروج مطمئن هستید؟')) {
      adminPanel.style.display = 'none';
      loginContainer.style.display = 'block';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginUser').value = '';
      document.getElementById('loginError').style.display = 'none';
    }
  });

  // ============================================================
  //  افزودن
  // ============================================================
  document.getElementById('addBtn').addEventListener('click', function() {
    const name = document.getElementById('fName').value.trim();
    const nationalId = document.getElementById('fNationalId').value.trim();
    const degree = document.getElementById('fDegree').value.trim();
    const major = document.getElementById('fMajor').value.trim();
    const units = document.getElementById('fUnits').value.trim();
    const gradDate = document.getElementById('fGradDate').value.trim();
    const university = document.getElementById('fUniversity').value.trim();
    const photo = currentPhotoLink;

    if (!name || !nationalId || !degree || !major || !gradDate || !university) {
      showToast('لطفاً تمام فیلدهای الزامی (*) را پر کنید', 'error');
      return;
    }

    const code = generateCode();
    if (!code) {
      showToast('خطا در تولید کد', 'error');
      return;
    }

    records[code] = {
      name,
      nationalId,
      degree,
      major,
      units: units || '—',
      gradDate,
      university,
      photo: photo || ''
    };

    const generatedDiv = document.getElementById('generatedCode');
    generatedDiv.textContent = '✅ کد صحت: ' + code;
    generatedDiv.style.display = 'block';

    // پاک کردن فرم
    document.getElementById('fName').value = '';
    document.getElementById('fNationalId').value = '';
    document.getElementById('fDegree').value = '';
    document.getElementById('fMajor').value = '';
    document.getElementById('fUnits').value = '';
    document.getElementById('fGradDate').value = '';
    document.getElementById('fUniversity').value = '';
    removePhotoLink();

    saveToStorage();
    renderTable();
    showToast(`رکورد با کد ${code} با موفقیت افزوده شد`, 'success');

    setTimeout(() => {
      generatedDiv.style.display = 'none';
    }, 8000);
  });

  // ============================================================
  //  بارگذاری اولیه
  // ============================================================
  loadFromStorage();
  renderTable();

})();
</script>
</body>
</html>
